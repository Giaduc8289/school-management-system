name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'frontend/**'
      - 'tasks/**'
      - 'scripts/**'
      - '.npm-audit-exceptions.json'
      - '.trivyignore.yaml'
      - 'Dockerfile'
      - 'compose.staging.yml'
      - 'jest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'frontend/**'
      - 'tasks/**'
      - 'scripts/**'
      - '.npm-audit-exceptions.json'
      - '.trivyignore.yaml'
      - 'Dockerfile'
      - 'compose.staging.yml'
      - 'jest.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'README.md'

permissions:
  contents: read

jobs:
  quality:
    name: Backend and frontend quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: school_management_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/school_management_test
      JWT_SECRET: ci-only-signing-key-with-at-least-32-characters
      NODE_ENV: test
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify npm audit gate with a controlled fixture
        run: node scripts/npm-audit-gate.mjs --test-fixture

      - name: Scan locked npm dependencies with npm audit
        run: node scripts/npm-audit-gate.mjs

      - name: Build API, frontend, and migration images for scanning
        run: |
          docker build --target runtime --tag school-management:ci-api .
          docker build --file frontend/Dockerfile --tag school-management:ci-frontend .
          docker build --target migration --tag school-management:ci-migration .

      - name: Scan API, frontend, and migration images with Trivy version 0.58.2 and fixed-version remediation
        env:
          TRIVY_VERSION: 0.58.2
        run: |
          for image in school-management:ci-api school-management:ci-frontend school-management:ci-migration; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$GITHUB_WORKSPACE:/work" \
              -w /work \
              "aquasecurity/trivy:${TRIVY_VERSION}" \
              image --ignorefile .trivyignore.yaml --scanners vuln \
              --severity HIGH,CRITICAL --exit-code 1 --format table "$image"
          done

      - name: Type-check backend
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Run backend tests and coverage gate
        run: npm test -- --runInBand --coverage

      - name: Verify PostgreSQL integration tests use the isolated CI database
        run: npx jest tests/integration/postgres-student.repository.test.ts --runInBand

      - name: Build frontend
        run: npm run build:frontend

      - name: Verify the frontend workspace build entry point
        run: npm --workspace frontend run build

      - name: Run frontend tests
        run: npm --workspace frontend run test

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end browser tests against isolated local services
        run: npm run test:e2e
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-e2e-signing-key-with-at-least-32-characters
          AUTH_ADMIN_EMAIL: ci-admin@example.test
          AUTH_ADMIN_PASSWORD: ci-only-e2e-password

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
