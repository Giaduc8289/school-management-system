server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /students {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /auth {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location /health {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
